name: Bug report
about: Something is broken or misbehaves
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report! Before you fill this in:

        - [Check the changelog](https://codeberg.org/fitguy/Chompass/src/branch/main/docs/CHANGELOG.md):
          fixes ship in batches and F-Droid can lag behind the newest release.
        - [Search the issues](https://codeberg.org/fitguy/Chompass/issues),
          open and closed, for the same problem.
        - If the calorie or macro math seems off, every formula and its sources
          are listed in
          [docs/CALCULATION_METHODS.md](https://codeberg.org/fitguy/Chompass/src/branch/main/docs/CALCULATION_METHODS.md).
    visible: [form]
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead. Screenshots are very welcome and can be attached here.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be reproduced?
      description: Optional, but a short list of taps helps a lot if you can.
      placeholder: |
        1.
        2.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings > About, e.g. 3.10.0
      placeholder: 3.10.0
    validations:
      required: true
  - type: dropdown
    id: install-source
    attributes:
      label: Where did you install the app?
      options:
        - F-Droid
        - Obtainium
        - Codeberg release APK
        - Self-built
        - Not sure
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      description: Optional. Helps when a bug only happens on some phones.
      placeholder: Pixel 8, Android 15
    validations:
      required: false
  - type: input
    id: locale
    attributes:
      label: App language
      description: Optional. Only if the app is not in English.
    validations:
      required: false
  - type: checkboxes
    id: prior-work
    attributes:
      label: Before you submit
      options:
        - label: I searched the open and closed issues for this problem
          required: true
        - label: I checked the [changelog](https://codeberg.org/fitguy/Chompass/src/branch/main/docs/CHANGELOG.md); F-Droid may lag the newest release
          required: true
