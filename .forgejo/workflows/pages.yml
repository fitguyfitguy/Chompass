# Publish the Hugo project site to Codeberg Pages (git-pages).
# One-time: repo Settings → Units → enable Actions.
#
# Live URL: https://fitguy.codeberg.page/NoFUD/

name: pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/screenshots/**'
      - '.forgejo/workflows/pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: codeberg-tiny
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          set -euo pipefail
          HUGO_VERSION=0.152.2
          curl -fsSL -o hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_Linux-64bit.tar.gz"
          tar -xzf hugo.tar.gz hugo
          chmod +x hugo
          ./hugo version

      - name: Build site
        run: ./hugo --minify -s website --baseURL https://fitguy.codeberg.page/NoFUD/

      - name: Deploy to Codeberg Pages
        if: ${{ forge.ref == 'refs/heads/main' }}
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://fitguy.codeberg.page/NoFUD/
          token: ${{ forge.token }}
          source: website/public/
