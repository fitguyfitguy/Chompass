    versionCode: 20
    commit: 60f1fa5ebd612053375e63ff0876fef6d5f16569
    subdir: android
    gradle:
      - yes
    prebuild:
      - sed -i '/implementation(libs.mlkit.barcode.scanning)/d' app/build.gradle.kts
      - sed -i '/^kotlin {$/,/^}$/d' app/build.gradle.kts
    gradleprops:
      - nofud.barcodeMlkit=false
      - releaseAbi=arm64-v8a

MaintainerNotes: |-
  New app: single Builds entry (latest only). Older tags used a removed fdroidRelease flavor.
  F-Droid sets nofud.barcodeMlkit=false — ML Kit excluded; barcode scan tile hidden.
  prebuild strips ML Kit dep + kotlin jvmToolchain(17) if present (Trixie has Java 21 only).
  releaseAbi=arm64-v8a: ndk.abiFilters + splits disabled → plain app-release-unsigned.apk
  (no output:). Avoids litertlm ABI mismatch on universal/fat APKs.
  No Binaries URL: Codeberg release APKs include ML Kit; F-Droid builds do not.

