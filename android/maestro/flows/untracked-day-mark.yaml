# Device-pass pilot flow 3: mark today not tracked, rough calories persist
# (DEVICE_PASS manual item 8).
# Selectors use the German strings (device locale de-DE, values-de/strings.xml).
appId: app.chompass.debug
name: Untracked day mark round trip
---
- launchApp
# First launch after install seeds a year of fixture data; wait it out.
- extendedWaitUntil:
    visible: "Heute"
    timeout: 90000
- assertVisible: "Heute"
- tapOn: "Tag markieren"                    # UntrackedChip (HomeCalorieHero)
- assertVisible: ".*bleibt außen vor.*"    # unique body fragment
- tapOn:                                    # toggle row: the Role.Switch row
    text: "Nicht erfasst"                   # below the body text (the toolbar
    below: ".*bleibt außen vor.*"           # title shares the label, but sits above)
- assertVisible: "Grobe Kalorien (optional)"
- tapOn: "Grobe Kalorien (optional)"        # focus the kcal field
- inputText: "350"
- tapOn: "Speichern"                        # action_save
- assertVisible: "Nicht erfasst"            # chip flipped to marked
- tapOn: "Nicht erfasst"                    # reopen the sheet
- assertVisible: "Grobe Kalorien (optional)"
- assertVisible: "350"                      # persisted value
