MaintainerNotes: |-
  New app: single Builds entry (v1.14.3+). Older tags used a removed fdroidRelease flavor.
  F-Droid sets nofud.barcodeMlkit=false — ML Kit excluded; barcode scan tile hidden.
  prebuild strips ML Kit dep + kotlin jvmToolchain(17) (Trixie buildserver has Java 21 only).
  releaseAbi=arm64-v8a: single-ABI APK. litertlm-android ships liblitertlm_jni.so only for
  arm64-v8a/x86_64; a universal APK triggered scanner Major "different libs in different ABI".
  On-device AI already gates on those ABIs (OnDeviceCapability); 32-bit devices keep core features.
  No Binaries URL: Codeberg release APKs include ML Kit; F-Droid builds do not.

