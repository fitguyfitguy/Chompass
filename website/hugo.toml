baseURL = 'https://chompass.app/'
locale = 'en-US'
title = 'Chompass'
disableKinds = ['taxonomy', 'term', 'RSS']
enableRobotsTXT = false
summaryLength = 20

[params]
  description = 'Ad-free AI calorie tracker: Android app and browser PWA. Bring your own cloud AI key on either client; optional on-device Gemma 4 on Android. No ads, no analytics.'
  version = '3.3.1'
  apkArm64Note = '~15 MiB'
  apkUniversalNote = '~27 MiB'
  repo = 'https://codeberg.org/fitguy/chompass'
  releases = 'https://codeberg.org/fitguy/chompass/releases'
  obtainium = 'https://apps.obtainium.imranr.dev/redirect?r=obtainium%3A%2F%2Fadd%2Fhttps%3A%2F%2Fcodeberg.org%2Ffitguy%2Fchompass'
  pwa = 'https://chompass.app/app/'
  privacyRepo = 'https://codeberg.org/fitguy/chompass/src/branch/main/docs/PRIVACY.md'
  upstream = 'https://github.com/apoorvdarshan/fud-ai'
  upstreamReleases = 'https://github.com/apoorvdarshan/fud-ai/releases'

[markup.goldmark.renderer]
  unsafe = true

[module]
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'
  [[module.mounts]]
    source = 'static'
    target = 'static'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'archetypes'
    target = 'archetypes'
  [[module.mounts]]
    source = '../docs/screenshots'
    target = 'static/screenshots'
